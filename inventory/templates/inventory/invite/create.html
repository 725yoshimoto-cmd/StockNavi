{% extends "base.html" %}

{% block content %}
  <p class="breadcrumb">
    <a href="{% url 'accounts:mypage' %}">マイページ</a>
    <span>＞</span>
    <span>メンバー招待</span>
  </p>

  <div class="container" style="max-width: 520px; margin: 0 auto; padding: 16px;">
    <h1 style="font-size: 20px; margin-bottom: 12px;">メンバー招待</h1>

    <p style="margin: 0 0 20px; font-size: 15px; color: #333;">
      <strong>所属世帯名：</strong> {{ request.user.household.name }}
    </p>

    <form method="post" style="margin-bottom: 16px;">
      {% csrf_token %}

      <label for="invite-email" style="display:block; margin: 0 0 6px;">
        招待リンク送付先メールアドレス
      </label>
      <input
        id="invite-email"
        type="email"
        name="email"
        placeholder="example@mail.com"
        required
        style="width:100%; padding:8px; margin-bottom: 12px;"
      >

      <button type="submit" class="btn btn-primary" style="width: 100%;">
        招待リンクを発行する
      </button>
    </form>
  </div>
{% endblock %}
