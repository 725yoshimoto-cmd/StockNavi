{% extends "base.html" %}
{% block content %}

<form method="post" action="{% url 'inventory:inventory_bulk_delete_execute' %}">
  {% csrf_token %}
  {% for id in selected_ids %}
    <input type="hidden" name="selected_ids" value="{{ id }}">
  {% endfor %}

  <div class="modal-backdrop">
    <div class="modal-card">
      <h2 class="modal-title modal-title-danger">削除確認</h2>

      <p class="modal-body">
        商品一覧から<br>
        本当に削除しますか？
      </p>

      <p class="modal-body">
        削除後は<br>
        過去の登録履歴から<br>
        確認できます。
      </p>

      {% if items %}
        <div style="margin: 0 0 18px; text-align:left; font-size:14px; color:#555;">
          {% for item in items %}
            <div style="margin-bottom:6px;">
              ・{{ item.name }}（数量: {{ item.quantity }}）
            </div>
          {% endfor %}
        </div>
      {% endif %}

      <div class="modal-actions">
        <button type="submit" class="modal-btn modal-btn-danger">はい</button>
        <a href="{% url 'inventory:inventory_list' %}?select_mode=1" class="modal-btn modal-btn-cancel">いいえ</a>
      </div>
    </div>
  </div>
</form>

{% endblock %}
