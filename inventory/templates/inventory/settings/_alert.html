<p class="alert-top-note">
  下記設定〜1までは <span class="blue">青字</span>、0は<span class="red">赤字</span> で表示
</p>

<p class="note">
  ※全在庫一律設定
</p>

<div class="alert-form-wrap">
  <form method="post" action="{% url 'inventory:settings_tabs' %}">
    {% csrf_token %}

    <input type="hidden" name="tab" value="alert">
    <input type="hidden" name="action" value="save_alert_setting">

    <div class="form-group">
      <label for="id_quantity_threshold">個数アラート</label>
      <div class="input-row">
        <input
          type="number"
          id="id_quantity_threshold"
          name="quantity_threshold"
          value="{{ alert_setting.quantity_threshold|default_if_none:1 }}"
          min="0"
        >
        <span>個以下</span>
      </div>
    </div>

    <div class="form-group">
      <label for="id_expiry_days">期限アラート</label>
      <div class="input-row">
        <input
          type="number"
          id="id_expiry_days"
          name="expiry_days"
          value="{{ alert_setting.expiry_days|default_if_none:30 }}"
          min="0"
        >
        <span>日以内</span>
      </div>
    </div>

    <div class="form-submit-center">
      <button type="submit" class="btn-primary-mid">保存</button>
    </div>
  </form>
</div>
