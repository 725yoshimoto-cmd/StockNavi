{% load static %}

<style>
  /* ===== 保管場所設定（このファイル専用）===== */
  .sn-loc-search-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 12px 0;
  }

  .sn-loc-search-wrap {
    flex: 1 1 auto;
    min-width: 0;
  }

  .sn-loc-search-wrap input[type="text"] {
    width: 100%;
    box-sizing: border-box;
  }

  .sn-loc-sort {
    margin: 10px 0 14px;
  }

  .sn-loc-table-wrap {
    width: 100%;
    overflow-x: auto;
  }

  .sn-loc-table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    background: #fff;
  }

  .sn-loc-table th,
  .sn-loc-table td {
    border: 1px solid #bdbdbd;
    padding: 8px 6px;
    vertical-align: top;
    font-size: 14px;
    word-break: break-word;
  }

  .sn-loc-table th {
    background: #e9e9e9;
    font-weight: 700;
    text-align: left;
  }

  .sn-loc-col-check {
    width: 44px;
    text-align: center;
  }

  .sn-loc-col-name {
    width: 120px;
  }

  .sn-loc-col-desc {
    width: auto;
  }

  .sn-loc-name-link {
    color: inherit;
    text-decoration: underline;
    font-weight: 700;
  }

  .sn-loc-empty {
    margin: 12px 0;
  }

  @media (max-width: 600px) {
    .sn-loc-search-row {
      gap: 8px;
    }

    .sn-loc-table th,
    .sn-loc-table td {
      font-size: 13px;
      padding: 7px 5px;
    }

    .sn-loc-col-check {
      width: 40px;
    }

    .sn-loc-col-name {
      width: 96px;
    }
  }
</style>

<form method="post" action="{% url 'inventory:settings_tabs' %}">
  {% csrf_token %}
  <input type="hidden" name="tab" value="storage">

  <div class="sn-loc-search-row">
    <div class="sn-loc-search-wrap">
      <input type="text" name="loc_q" value="{{ loc_q }}" placeholder="保管場所を検索">
    </div>

    <button type="submit"
            formaction="{% url 'inventory:settings_tabs' %}"
            formmethod="get"
            class="search-icon-btn"
            aria-label="検索">
      <img src="{% static 'images/検索.png' %}" alt="検索">
    </button>

    <a href="{% url 'inventory:storage_location_add' %}?next={% url 'inventory:settings_tabs' %}%3Ftab%3Dstorage"
       class="fab" aria-label="保管場所を追加">
      <span>＋</span>
    </a>

    <button type="submit"
            name="action"
            value="bulk_delete_storage"
            class="icon-btn"
            aria-label="保管場所を削除"
            onclick="return confirm('選択した保管場所を削除しますか？');">
      <img src="{% static 'images/trash.png' %}" alt="削除">
    </button>
  </div>

  {% if locations %}
    <div class="sn-loc-table-wrap">
      <table class="sn-loc-table">
        <thead>
          <tr>
            <th class="sn-loc-col-check">選択</th>
            <th class="sn-loc-col-name">
              <a href="?tab=storage&loc_sort=name{% if loc_q %}&loc_q={{ loc_q }}{% endif %}"
                style="color: inherit; text-decoration: none;">
                保管場所▽
              </a>
            </th>
            <th class="sn-loc-col-desc">概要</th>
          </tr>
        </thead>
        <tbody>
          {% for loc in locations %}
            <tr>
              <td class="sn-loc-col-check">
                <input type="checkbox" name="selected_ids" value="{{ loc.id }}">
              </td>
              <td class="sn-loc-col-name">
                <a class="sn-loc-name-link"
                   href="{% url 'inventory:storage_location_edit' loc.pk %}?next={% url 'inventory:settings_tabs' %}%3Ftab%3Dstorage">
                  {{ loc.name }}
                </a>
              </td>
              <td class="sn-loc-col-desc">
                {% if loc.description %}
                  {{ loc.description }}
                {% else %}
                  未設定
                {% endif %}
              </td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  {% else %}
    <p class="sn-loc-empty">保管場所はありません。</p>
  {% endif %}
</form>
