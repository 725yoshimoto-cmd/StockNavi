{% extends "base.html" %}
{% block title %}再設定完了{% endblock %}

{% block content %}
<div class="auth-wrap">
  <p class="auth-breadcrumb">
    <a href="{% url 'login' %}">ログイン</a>
    <span>＞</span>
    <span>再設定完了</span>
  </p>

  <h1 class="auth-title">再設定完了</h1>

  <div class="auth-card">
    <p class="auth-text">
      パスワードを再設定しました。<br>
      新しいパスワードでログインしてください。
    </p>

    <div class="auth-submit">
      <a href="{% url 'login' %}" class="auth-btn-link">ログインする</a>
    </div>
  </div>
</div>

<style>
  .auth-wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 16px 12px 96px;
    box-sizing: border-box;
  }

  .auth-breadcrumb {
    margin: 6px 0 12px;
    font-size: 14px;
    color: #666;
  }

  .auth-breadcrumb a {
    color: #666;
    text-decoration: none;
  }

  .auth-title {
    margin: 0 0 16px;
    font-size: 28px;
    font-weight: 700;
    color: #222;
  }

  .auth-card {
    padding: 20px 16px;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
  }

  .auth-text {
    line-height: 1.7;
    color: #444;
  }

  .auth-submit {
    margin-top: 24px;
    text-align: center;
  }

  .auth-btn-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 180px;
    height: 44px;
    padding: 0 20px;
    border-radius: 999px;
    background: #2f80ed;
    color: #fff;
    text-decoration: none;
    font-size: 16px;
    font-weight: 700;
  }
</style>
{% endblock %}
