{% extends "base.html" %}

{% block title %}マイページ | StockNavi{% endblock %}

{% block content %}
<style>
  .mypage-page {
    max-width: 360px;
    margin: 0 auto;
    padding: 8px 16px 24px;
    position: relative;
  }

  .mypage-menu-wrap {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 12px;
  }

  .mypage-menu-btn {
    border: none;
    background: transparent;
    font-size: 28px;
    line-height: 1;
    color: #444;
    cursor: pointer;
    padding: 4px 8px;
  }

  .mypage-divider {
    border: none;
    border-top: 1px solid #cfcfcf;
    margin: 18px 0 22px;
  }

  .mypage-section-title {
    margin: 0 0 18px;
    font-size: 18px;
    font-weight: 700;
    color: #333;
  }

  .mypage-form {
    display: grid;
    gap: 16px;
  }

  .mypage-form-group label {
    display: block;
    margin-bottom: 8px;
    font-size: 16px;
    font-weight: 700;
    color: #333;
  }

  .mypage-form-group input {
    width: 100%;
    height: 46px;
    padding: 10px 14px;
    border: 1px solid #c8ced8;
    border-radius: 14px;
    background: #fff;
    font-size: 16px;
    box-sizing: border-box;
  }

  .mypage-password-link {
    margin: 4px 0 0;
    font-size: 15px;
  }

  .mypage-password-link a {
    color: #2563eb;
    text-decoration: underline;
  }

  .mypage-logout-wrap {
    margin-top: 8px;
    display: flex;
    justify-content: center;
  }

  .mypage-logout-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 180px;
    height: 44px;
    padding: 0 20px;
    border: 1px solid #bfc5ce;
    border-radius: 999px;
    background: #fff;
    color: #ef4444;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
  }

  .mypage-save-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 180px;
    height: 44px;
    padding: 0 20px;
    border-radius: 999px;
    font-size: 18px;
    font-weight: 700;
  }

  .mypage-modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.25);
    z-index: 400;
  }

  .mypage-modal-backdrop.is-open {
    display: block;
  }

  .mypage-modal {
    position: absolute;
    top: 44px;
    right: 16px;
    width: 220px;
    background: #fff;
    border: 1px solid #d1d5db;
    border-radius: 18px;
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.12);
    padding: 14px 0 12px;
    z-index: 500;
    display: none;
  }

  .mypage-modal.is-open {
    display: block;
  }

  .mypage-modal-title {
    margin: 0;
    padding: 0 18px 10px;
    font-size: 18px;
    font-weight: 700;
    color: #444;
    text-align: center;
  }

  .mypage-modal-divider {
    border: none;
    border-top: 1px solid #d9d9d9;
    margin: 0 16px 10px;
  }

  .mypage-modal-link {
    display: block;
    padding: 12px 18px;
    text-align: center;
    color: #444;
    text-decoration: none;
    font-size: 17px;
  }

  .mypage-modal-close-wrap {
    padding: 10px 18px 0;
  }

  .mypage-modal-close {
    width: 100%;
    height: 42px;
    border: none;
    border-radius: 12px;
    background: #efefef;
    color: #555;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }

  .custom-modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.35);
    z-index: 900;
  }

  .custom-modal-backdrop.is-open {
    display: block;
  }

  .custom-modal {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 220px;
    background: #fff;
    border: 1px solid #666;
    border-radius: 12px;
    padding: 18px 14px 16px;
    box-sizing: border-box;
    z-index: 901;
    box-shadow: none;
  }

  .custom-modal.is-open {
    display: block;
  }

  .custom-modal-title {
    margin: 0 0 12px;
    font-size: 18px;
    font-weight: 700;
    text-align: center;
    color: #ef4444;
  }

  .custom-modal-text {
    margin: 0 0 16px;
    font-size: 14px;
    line-height: 1.5;
    text-align: center;
    color: #333;
  }

  .custom-modal-actions {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
  }

  .custom-modal-btn {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    width: 72px;
    height: 36px;
    padding: 0;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }

  .custom-modal-btn-cancel {
    background: #4f8df7;
    color: #fff;
  }

  .custom-modal-btn-danger {
    background: #ef6b63;
    color: #fff;
  }

</style>

<div class="mypage-page">

<p class="breadcrumb">
  <span>マイページ</span>
</p>

  <div class="mypage-menu-wrap">
    <button type="button" class="mypage-menu-btn" id="mypageMenuBtn" aria-label="メニューを開く">︙</button>
  </div>

  <div class="mypage-modal-backdrop" id="mypageModalBackdrop"></div>

  <div class="mypage-modal" id="mypageModal">
    <h2 class="mypage-modal-title">メンバー管理</h2>
    <hr class="mypage-modal-divider">

    <a href="{% url 'accounts:member_list' %}" class="mypage-modal-link">
      メンバー一覧
    </a>

    <a href="{% url 'inventory:invite_create' %}" class="mypage-modal-link">
      メンバー招待
    </a>

    <div class="mypage-modal-close-wrap">
      <button type="button" class="mypage-modal-close" id="mypageModalClose">
        閉じる
      </button>
    </div>
  </div>

  <h3 class="mypage-section-title">ユーザー情報</h3>

  <form method="post" class="mypage-form">
    {% csrf_token %}
    
    <p style="margin: 0 0 18px; font-size: 15px; color: #333;">
      <strong>所属世帯名：</strong> {{ user.household.name }}
    </p>

    <div class="mypage-form-group">
      <label for="{{ form.username.id_for_label }}">アカウント名</label>
      {{ form.username }}
    </div>

    <div class="mypage-form-group">
      <label for="{{ form.email.id_for_label }}">メールアドレス</label>
      {{ form.email }}
    </div>

    <p class="mypage-password-link">
      <a href="{% url 'accounts:password_reset' %}">パスワード変更</a>
    </p>

    <div class="form-submit-center">
      <button type="submit" class="btn-primary-mid mypage-save-btn">保存</button>
    </div>
  </form>

  <hr class="mypage-divider">

  <div class="mypage-logout-wrap">
    <button
      type="button"
      class="mypage-logout-btn"
      id="logoutOpenBtn"
      onclick="openLogoutModal(); return false;"
    >
      ログアウト
    </button>
  </div>

  <div class="custom-modal-backdrop" id="logoutModalBackdrop"></div>

  <div class="custom-modal" id="logoutModal">
    <h2 class="custom-modal-title">ログアウト確認</h2>
    <p class="custom-modal-text">
      本当にログアウトしますか？
    </p>

    <div class="custom-modal-actions">
      <button
        type="button"
        class="custom-modal-btn custom-modal-btn-cancel"
        id="logoutCancelBtn"
      >
        いいえ
      </button>

      <form method="post" action="{% url 'logout' %}" style="margin: 0;">
        {% csrf_token %}
        <button type="submit" class="custom-modal-btn custom-modal-btn-danger">
          はい
        </button>
      </form>
    </div>
  </div>
</div>

<script>
  const mypageMenuBtn = document.getElementById("mypageMenuBtn");
  const mypageModal = document.getElementById("mypageModal");
  const mypageModalBackdrop = document.getElementById("mypageModalBackdrop");
  const mypageModalClose = document.getElementById("mypageModalClose");

  function openMypageModal() {
    if (mypageModal && mypageModalBackdrop) {
      mypageModal.classList.add("is-open");
      mypageModalBackdrop.classList.add("is-open");
    }
  }

  function closeMypageModal() {
    if (mypageModal && mypageModalBackdrop) {
      mypageModal.classList.remove("is-open");
      mypageModalBackdrop.classList.remove("is-open");
    }
  }

  if (mypageMenuBtn) {
    mypageMenuBtn.addEventListener("click", openMypageModal);
  }

  if (mypageModalBackdrop) {
    mypageModalBackdrop.addEventListener("click", closeMypageModal);
  }

  if (mypageModalClose) {
    mypageModalClose.addEventListener("click", closeMypageModal);
  }

  const logoutModal = document.getElementById("logoutModal");
  const logoutModalBackdrop = document.getElementById("logoutModalBackdrop");
  const logoutCancelBtn = document.getElementById("logoutCancelBtn");

  function openLogoutModal() {
    if (logoutModal && logoutModalBackdrop) {
      logoutModal.classList.add("is-open");
      logoutModalBackdrop.classList.add("is-open");
    }
  }

  function closeLogoutModal() {
    if (logoutModal && logoutModalBackdrop) {
      logoutModal.classList.remove("is-open");
      logoutModalBackdrop.classList.remove("is-open");
    }
  }

  if (logoutCancelBtn) {
    logoutCancelBtn.addEventListener("click", closeLogoutModal);
  }

  if (logoutModalBackdrop) {
    logoutModalBackdrop.addEventListener("click", closeLogoutModal);
  }
</script>
{% endblock %}
